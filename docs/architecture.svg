  <text x="28" y="360" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">Access JWT on every REST call and the socket handshake. Refresh token is an httpOnly cookie, hashed in Mongo.</text>
