  <text x="209.0" y="277" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6e6458">socket + REST</text>
  <rect x="250" y="70" width="150" height="70" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
