  <text x="98.0" y="101.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">Browser A</text>
  <text x="98.0" y="119.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">JWT in memory</text>
